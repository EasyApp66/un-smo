<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-v3-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UN-SMO" />
    <meta name="theme-color" content="#F5F4F9" />
    <title>UN-SMO</title>
    <meta name="description" content="Private Anwendung." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />


    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-300.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-500.woff2" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <script>
      // Theme vor dem ersten Zeichnen setzen – kein Aufblitzen
      (function () {
        try {
          var mode = 'system';
          var raw = localStorage.getItem('smoke-storage');
          if (raw) {
            var parsed = JSON.parse(raw);
            mode = (parsed && parsed.state && parsed.state.themeMode) || 'system';
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.backgroundColor = dark ? '#000000' : '#F5F4F9';
        } catch (e) {}
      })();
    </script>
  </head>

  <style>
    html, body { background-color: #F5F4F9; overscroll-behavior-y: none; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #000000; }
    }
    html.dark, html.dark body { background-color: #000000; }
  </style>

  <style>
    /* Startbildschirm: vom ersten Pixel an sichtbar, noch bevor die App lädt.
       Wird von der App entfernt, sobald sie bereit ist. */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background-color: #F5F4F9;
      transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (prefers-color-scheme: dark) { #boot-splash { background-color: #000000; } }
    html.dark #boot-splash { background-color: #000000; }
    #boot-splash img {
      width: 80px; height: 80px; user-select: none; -webkit-user-drag: none;
      animation: boot-splash-in 340ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes boot-splash-in {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    #boot-splash.out { opacity: 0; pointer-events: none; }
  </style>
  <body>
    <div id="boot-splash"><img src="/mark.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
